name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: ftdcare_test
          POSTGRES_USER: ftdcare_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ftdcare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ftdcare_test
      DB_USER: ftdcare_test
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-signing-key-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
      ENABLE_DEV_PERSONAS: 'true'
      ENABLE_DEV_AUTH_PREVIEWS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm --prefix app audit --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:eslint
      - run: npm run format:check
      - run: npm test
      - run: npm run backend:migrate
      - run: npm run backend:migrate
      - run: npm run backend:seed
      - run: npm run backend:test
      - run: npm run build
      - run: docker build -t ftdcare:ci .
